<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sombrero Shuffle</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* =============================================
           BASE STYLES
           Warm ochre parchment — like a page from
           a Sven Nordqvist picture book
        ============================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Fredoka', 'Trebuchet MS', 'Comic Sans MS', cursive, sans-serif;
            background-color: #F5E4C4;
            background-image:
                radial-gradient(#DECA9E 0.7px, transparent 0.7px),
                radial-gradient(#D4BC8A 0.4px, transparent 0.4px);
            background-size: 22px 22px, 13px 13px;
            background-position: 0 0, 11px 11px;
            color: #3C2415;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Warm vignette — like looking at a book page */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 150px rgba(120, 85, 30, 0.12);
            pointer-events: none;
            z-index: 9999;
        }

        /* =============================================
           SCREENS
        ============================================= */
        .screen {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .screen.active { display: flex; }

        /* =============================================
           TITLE SCREEN
        ============================================= */
        .title-area {
            position: relative;
            text-align: center;
            margin-bottom: 8px;
        }

        .title-sombrero {
            display: inline-block;
            transform: rotate(-8deg);
            margin-bottom: -5px;
        }

        .title-findus {
            position: absolute;
            right: -55px;
            bottom: -15px;
            transform: scale(0.55);
            transform-origin: bottom right;
        }

        .game-title {
            font-size: 3.5rem;
            font-weight: 700;
            color: #B8463A;
            text-align: center;
            line-height: 1.1;
            text-shadow: 2px 3px 0 rgba(0, 0, 0, 0.06);
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 1.4rem;
            color: #8B6914;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .subtitle-hint {
            font-size: 0.95rem;
            color: #A89070;
            margin-bottom: 30px;
        }

        /* =============================================
           BUTTONS
        ============================================= */
        .btn {
            font-family: 'Fredoka', 'Trebuchet MS', cursive, sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            padding: 14px 44px;
            border: none;
            border-radius: 14px;
            background: #B8463A;
            color: #FFF;
            cursor: pointer;
            box-shadow: 0 5px 0 #7A3025, 0 7px 18px rgba(0, 0, 0, 0.15);
            transition: all 0.12s ease;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            background: #CC5548;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #7A3025, 0 10px 24px rgba(0, 0, 0, 0.18);
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #7A3025, 0 3px 8px rgba(0, 0, 0, 0.15);
        }
        .btn-start {
            animation: pulse 2.5s ease-in-out infinite;
        }
        .btn-start:hover { animation: none; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        /* =============================================
           GAME SCREEN LAYOUT
        ============================================= */
        #game-screen {
            padding: 30px 20px;
            justify-content: flex-start;
            padding-top: 50px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            width: 540px;
            margin-bottom: 16px;
            font-size: 1.2rem;
            font-weight: 600;
        }
        .level-display { color: #B8463A; }
        .score-display { color: #8B6914; }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* =============================================
           LEVEL ANNOUNCEMENT
        ============================================= */
        .level-announce {
            font-size: 2.8rem;
            font-weight: 700;
            color: #B8463A;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.06);
            opacity: 0;
            transition: opacity 0.4s ease;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .level-announce.visible { opacity: 1; }

        /* =============================================
           SOMBRERO CONTAINER & WRAPPERS
        ============================================= */
        #sombrero-container {
            position: relative;
            width: 540px;
            height: 140px;
            overflow: visible;
        }

        .sombrero-wrapper {
            position: absolute;
            width: 148px;
            bottom: 0;
            cursor: default;
            transition: left 0.5s ease-in-out;
        }
        .sombrero-wrapper.clickable { cursor: pointer; }
        .sombrero-wrapper.clickable:hover .sombrero-hat {
            transform: translateY(-8px) rotate(var(--hat-tilt, 0deg));
            filter: brightness(1.08);
        }

        /* =============================================
           SOMBRERO HAT (wraps the SVG)
        ============================================= */
        .sombrero-hat {
            position: relative;
            z-index: 2;
            transition: transform 0.4s ease-out, filter 0.2s;
            transform: rotate(var(--hat-tilt, 0deg));
        }
        .sombrero-hat.lifted {
            transform: translateY(-85px) rotate(var(--hat-tilt, 0deg)) !important;
        }
        .sombrero-hat svg { display: block; }

        /* Slight hand-drawn tilts — like Nordqvist sketched them */
        .sombrero-wrapper:nth-child(1) .sombrero-hat { --hat-tilt: -1.5deg; }
        .sombrero-wrapper:nth-child(2) .sombrero-hat { --hat-tilt: 1deg; }
        .sombrero-wrapper:nth-child(3) .sombrero-hat { --hat-tilt: -0.8deg; }

        /* =============================================
           MEATBALL CSS ART
           (Kept as CSS — it's small and works well)
        ============================================= */
        .meatball-area {
            display: flex;
            justify-content: center;
            padding-top: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            position: relative;
            z-index: 1;
        }
        .meatball-area.visible { opacity: 1; }

        .meatball {
            width: 32px;
            height: 32px;
            background: radial-gradient(circle at 38% 35%, #9B7340, #6B4226 55%, #3D2614);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 3px 8px rgba(0,0,0,0.35), inset 2px 2px 4px rgba(255,220,180,0.12);
        }
        .meatball::before {
            content: '';
            position: absolute;
            top: 8px; left: 6px;
            width: 5px; height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .meatball::after {
            content: '';
            position: absolute;
            top: 14px; right: 7px;
            width: 4px; height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
        }

        .flag-stick {
            position: absolute;
            width: 2px; height: 24px;
            background: linear-gradient(180deg, #B8A080, #8B7355);
            left: 50%; top: -24px;
            transform: translateX(-50%);
            border-radius: 1px;
        }
        .swedish-flag {
            position: absolute;
            width: 18px; height: 12px;
            background: #006AA7;
            top: -24px;
            left: calc(50% + 1px);
            border-radius: 1px;
            overflow: hidden;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .flag-cross-h {
            position: absolute;
            width: 100%; height: 2.5px;
            background: #FECC02;
            top: 4.75px;
        }
        .flag-cross-v {
            position: absolute;
            width: 2.5px; height: 100%;
            background: #FECC02;
            left: 5.5px;
        }

        /* =============================================
           TABLE
        ============================================= */
        .table-wrapper { position: relative; }

        .table-surface {
            width: 580px;
            height: 45px;
            background:
                repeating-linear-gradient(92deg,
                    transparent, transparent 35px,
                    rgba(120,75,30,0.08) 35px, rgba(120,75,30,0.08) 36px),
                linear-gradient(180deg, #C4913A, #B08030 40%, #9A7028 90%);
            border-radius: 6px 6px 16px 16px;
            margin-top: -2px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.18);
            position: relative;
            overflow: hidden;
        }
        .table-edge {
            width: 100%; height: 10px;
            background: repeating-linear-gradient(90deg,
                #C84A3A 0px, #C84A3A 10px,
                #E8C43F 10px, #E8C43F 20px,
                #5A8F4A 20px, #5A8F4A 30px,
                #C84A3A 30px, #C84A3A 40px,
                #4A8FAD 40px, #4A8FAD 50px,
                #E8C43F 50px, #E8C43F 60px);
            position: absolute;
            bottom: 0;
            border-radius: 0 0 16px 16px;
        }
        .table-surface::before {
            content: '';
            position: absolute;
            top: 0; left: 5%; right: 5%;
            height: 3px;
            background: rgba(255,220,150,0.25);
            border-radius: 2px;
        }

        /* =============================================
           SCENE DRESSING — positioned around the table
        ============================================= */
        .scene-geranium {
            position: absolute;
            left: -60px;
            bottom: -5px;
        }

        .scene-mouse {
            position: absolute;
            right: 50px;
            bottom: -12px;
        }

        .scene-findus {
            position: absolute;
            right: -62px;
            bottom: 2px;
        }

        /* Findus tail wag animation */
        .findus-tail-anim {
            animation: tailWag 2.5s ease-in-out infinite;
            transform-origin: 8px 32px;
        }
        @keyframes tailWag {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(12deg); }
        }

        /* =============================================
           FEEDBACK TEXT
        ============================================= */
        .feedback {
            font-size: 1.5rem;
            font-weight: 600;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 25px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .feedback.visible { opacity: 1; }
        .feedback.correct { color: #3A8A4A; }
        .feedback.wrong { color: #B8463A; }
        .feedback.prompt {
            color: #8B6914;
            animation: gentleBounce 1.5s ease-in-out infinite;
        }
        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* =============================================
           END SCREEN
        ============================================= */
        .end-title { font-size: 2.5rem; color: #B8463A; margin-bottom: 20px; }
        .final-score-display { font-size: 4rem; font-weight: 700; color: #8B6914; margin-bottom: 15px; }
        .final-message {
            font-size: 1.2rem; color: #5D4037;
            margin-bottom: 30px; max-width: 400px;
            text-align: center; line-height: 1.4;
        }

        /* =============================================
           MUTE BUTTON
        ============================================= */
        .mute-btn {
            position: fixed; top: 16px; right: 16px;
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 2px solid #C4A265;
            background: rgba(245, 228, 196, 0.9);
            font-size: 1.2rem;
            cursor: pointer; z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .mute-btn:hover {
            background: #FFF;
            border-color: #B8463A;
            transform: scale(1.1);
        }

        .instructions {
            font-size: 0.9rem;
            color: #A89070;
            margin-top: 20px;
            text-align: center;
            line-height: 1.5;
            max-width: 320px;
        }
    </style>
</head>
<body>

    <!-- ==========================================
         SVG DEFINITIONS
         Shared gradients, patterns, and filters
         used by all the inline SVG illustrations
    =========================================== -->
    <svg style="position:absolute; width:0; height:0; overflow:hidden;">
        <defs>
            <!-- Sombrero fill gradients (3 variations — like hand-mixed paint) -->
            <radialGradient id="sg0" cx="35%" cy="28%" r="70%">
                <stop offset="0%" stop-color="#E8634A"/>
                <stop offset="55%" stop-color="#C84A3A"/>
                <stop offset="100%" stop-color="#8B3525"/>
            </radialGradient>
            <radialGradient id="sg1" cx="35%" cy="28%" r="70%">
                <stop offset="0%" stop-color="#E87858"/>
                <stop offset="55%" stop-color="#C45842"/>
                <stop offset="100%" stop-color="#8E3E2C"/>
            </radialGradient>
            <radialGradient id="sg2" cx="35%" cy="28%" r="70%">
                <stop offset="0%" stop-color="#DA5C48"/>
                <stop offset="55%" stop-color="#B84838"/>
                <stop offset="100%" stop-color="#853225"/>
            </radialGradient>

            <!-- Gold band gradient -->
            <linearGradient id="band-grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#F7DC6F"/>
                <stop offset="50%" stop-color="#F4D03F"/>
                <stop offset="100%" stop-color="#D4AC0D"/>
            </linearGradient>
        </defs>
    </svg>


    <!-- ==========================================
         TITLE SCREEN
    =========================================== -->
    <div id="title-screen" class="screen active">
        <div class="title-area">
            <!-- SVG sombrero for the title -->
            <div class="title-sombrero">
                <svg viewBox="0 0 150 88" width="120" height="70">
                    <ellipse cx="75" cy="84" rx="58" ry="5" fill="rgba(0,0,0,0.08)"/>
                    <path d="M 7,74 Q 38,65 75,64 Q 112,65 143,74 Q 128,89 75,89 Q 22,89 7,74 Z" fill="url(#sg0)" stroke="#7A3025" stroke-width="1.3" stroke-linejoin="round"/>
                    <path d="M 44,71 C 43,53 41,28 49,16 C 56,7 66,4 75,3 C 84,4 94,7 101,16 C 109,28 107,53 106,71" fill="url(#sg0)" stroke="#7A3025" stroke-width="1.3" stroke-linejoin="round"/>
                    <rect x="44" y="61" width="62" height="10" rx="2" fill="url(#band-grad)" stroke="#B8892A" stroke-width="0.7"/>
                    <path d="M 46,66 L 50,62 L 54,66 L 58,62 L 62,66 L 66,62 L 70,66 L 74,62 L 78,66 L 82,62 L 86,66 L 90,62 L 94,66 L 98,62 L 102,66" fill="none" stroke="rgba(160,120,30,0.35)" stroke-width="0.7"/>
                    <path d="M 10,74 Q 75,87 140,74" fill="none" stroke="#6A2520" stroke-width="0.8" opacity="0.4"/>
                    <path d="M 54,20 Q 66,8 82,13" fill="none" stroke="rgba(255,220,180,0.2)" stroke-width="4" stroke-linecap="round"/>
                </svg>
            </div>
            <!-- Small Findus peeking next to the sombrero -->
            <div class="title-findus">
                <svg viewBox="0 0 65 95" width="65" height="95">
                    <g class="findus-tail-anim"><path d="M 48,32 Q 62,20 58,6" stroke="#C9963E" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M 53,24 L 58,21" stroke="#8B6A2F" stroke-width="1.8" fill="none"/><path d="M 56,16 L 60,12" stroke="#8B6A2F" stroke-width="1.8" fill="none"/></g>
                    <ellipse cx="32" cy="62" rx="15" ry="20" fill="#C9963E"/>
                    <path d="M 21,52 Q 32,50 43,52" stroke="#8B6A2F" stroke-width="2" fill="none"/><path d="M 20,58 Q 32,56 44,58" stroke="#8B6A2F" stroke-width="2" fill="none"/><path d="M 20,64 Q 32,62 44,64" stroke="#8B6A2F" stroke-width="2" fill="none"/>
                    <path d="M 18,62 Q 18,88 32,90 Q 46,88 46,62" fill="#5A8F4A"/><path d="M 20,68 Q 32,66 44,68" stroke="#447038" stroke-width="1.5" fill="none"/><path d="M 19,74 Q 32,72 45,74" stroke="#447038" stroke-width="1.5" fill="none"/><path d="M 19,80 Q 32,78 45,80" stroke="#447038" stroke-width="1.5" fill="none"/>
                    <path d="M 24,62 L 26,54" stroke="#5A8F4A" stroke-width="2.5" stroke-linecap="round"/><path d="M 40,62 L 38,54" stroke="#5A8F4A" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="32" cy="34" r="13" fill="#C9963E"/>
                    <polygon points="22,26 19,12 28,22" fill="#C9963E" stroke="#A07830" stroke-width="0.6"/><polygon points="42,26 45,12 36,22" fill="#C9963E" stroke="#A07830" stroke-width="0.6"/>
                    <polygon points="23,24 20.5,15 27,22" fill="#E8C0A8"/><polygon points="41,24 43.5,15 37,22" fill="#E8C0A8"/>
                    <circle cx="27" cy="33" r="2.2" fill="#2C1810"/><circle cx="37" cy="33" r="2.2" fill="#2C1810"/><circle cx="27.8" cy="32.2" r="0.7" fill="#FFF"/><circle cx="37.8" cy="32.2" r="0.7" fill="#FFF"/>
                    <polygon points="32,36 30,38.5 34,38.5" fill="#D4887A"/>
                    <line x1="15" y1="34" x2="26" y2="35.5" stroke="#A07830" stroke-width="0.5"/><line x1="14" y1="37" x2="26" y2="37" stroke="#A07830" stroke-width="0.5"/><line x1="15" y1="40" x2="26" y2="38.5" stroke="#A07830" stroke-width="0.5"/>

                </svg>
            </div>
        </div>

        <h1 class="game-title">Sombrero<br>Shuffle</h1>
        <p class="subtitle">Find the k&ouml;ttbulle!</p>
        <p class="subtitle-hint">(That's "meatball" in Swedish)</p>
        <button id="start-btn" class="btn btn-start">&#161;Spela!</button>
        <p class="instructions">Watch where the meatball hides,<br>then follow the sombreros as they shuffle.</p>
    </div>


    <!-- ==========================================
         GAME SCREEN
    =========================================== -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <div class="level-display">Level <span id="level-num">1</span> / 5</div>
            <div class="score-display">Score: <span id="score-num">0</span> / 5</div>
        </div>

        <div id="level-announce" class="level-announce"></div>

        <div class="game-area">
            <div id="sombrero-container"></div>

            <div class="table-wrapper">
                <!-- Potted geranium — appears in every Nordqvist scene -->
                <div class="scene-geranium">
                    <svg viewBox="0 0 55 85" width="48" height="74">
                        <path d="M 14,52 L 17,80 L 37,80 L 40,52 Z" fill="#A0522D" stroke="#7A3A18" stroke-width="1" stroke-linejoin="round"/>

                        <ellipse cx="36" cy="37" rx="6" ry="4" fill="#5A8F4A" transform="rotate(15,36,37)" opacity="0.8"/>
                        <ellipse cx="24" cy="44" rx="5" ry="3.5" fill="#5A8F4A" transform="rotate(10,24,44)" opacity="0.7"/>
                        <circle cx="20" cy="25" r="3.8" fill="#C84A3A"/><circle cx="15" cy="22" r="3.2" fill="#D45A4A"/><circle cx="24" cy="22" r="3" fill="#B83A2A"/>
                        <circle cx="32" cy="22" r="3.5" fill="#D45A4A"/><circle cx="36" cy="25" r="3" fill="#C84A3A"/><circle cx="28" cy="19" r="2.8" fill="#B83A2A"/>
                        <circle cx="14" cy="30" r="3" fill="#C84A3A"/><circle cx="11" cy="27" r="2.5" fill="#D45A4A"/>
                        <circle cx="40" cy="28" r="3" fill="#C84A3A"/><circle cx="43" cy="31" r="2.5" fill="#D45A4A"/>
                        <circle cx="18" cy="18" r="1.5" fill="#F4D03F" opacity="0.6"/><circle cx="30" cy="17" r="1.5" fill="#F4D03F" opacity="0.6"/><circle cx="38" cy="22" r="1.2" fill="#F4D03F" opacity="0.5"/>
                    </svg>
                </div>

                <div class="table-surface">
                    <div class="table-edge"></div>
                </div>

                <!-- Findus the cat — watching the game -->
                <div class="scene-findus">
                    <svg viewBox="0 0 65 95" width="55" height="82">
                        <!-- Tail with wag animation -->
                        <g class="findus-tail-anim">
                            <path d="M 48,32 Q 62,20 58,6" stroke="#C9963E" stroke-width="5" fill="none" stroke-linecap="round"/>
                            <path d="M 53,24 L 58,21" stroke="#8B6A2F" stroke-width="1.8" fill="none"/>
                            <path d="M 56,16 L 60,12" stroke="#8B6A2F" stroke-width="1.8" fill="none"/>
                            <path d="M 55,9 L 58,5" stroke="#8B6A2F" stroke-width="1.8" fill="none"/>
                        </g>
                        <!-- Body with tabby stripes -->
                        <ellipse cx="32" cy="62" rx="15" ry="20" fill="#C9963E"/>
                        <path d="M 21,52 Q 32,50 43,52" stroke="#8B6A2F" stroke-width="2" fill="none"/>
                        <path d="M 20,58 Q 32,56 44,58" stroke="#8B6A2F" stroke-width="2" fill="none"/>
                        <path d="M 20,64 Q 32,62 44,64" stroke="#8B6A2F" stroke-width="2" fill="none"/>
                        <!-- Green striped overalls -->
                        <path d="M 18,62 Q 18,88 32,90 Q 46,88 46,62" fill="#5A8F4A"/>
                        <path d="M 20,68 Q 32,66 44,68" stroke="#447038" stroke-width="1.5" fill="none"/>
                        <path d="M 19,74 Q 32,72 45,74" stroke="#447038" stroke-width="1.5" fill="none"/>
                        <path d="M 19,80 Q 32,78 45,80" stroke="#447038" stroke-width="1.5" fill="none"/>
                        <!-- Overall straps -->
                        <path d="M 24,62 L 26,54" stroke="#5A8F4A" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M 40,62 L 38,54" stroke="#5A8F4A" stroke-width="2.5" stroke-linecap="round"/>
                        <!-- Paws -->
                        <ellipse cx="22" cy="90" rx="5" ry="3" fill="#C9963E"/>
                        <ellipse cx="42" cy="90" rx="5" ry="3" fill="#C9963E"/>
                        <!-- Head -->
                        <circle cx="32" cy="34" r="13" fill="#C9963E"/>
                        <!-- Ears -->
                        <polygon points="22,26 19,12 28,22" fill="#C9963E" stroke="#A07830" stroke-width="0.6"/>
                        <polygon points="42,26 45,12 36,22" fill="#C9963E" stroke="#A07830" stroke-width="0.6"/>
                        <polygon points="23,24 20.5,15 27,22" fill="#E8C0A8"/>
                        <polygon points="41,24 43.5,15 37,22" fill="#E8C0A8"/>
                        <!-- Eyes with highlights -->
                        <circle cx="27" cy="33" r="2.2" fill="#2C1810"/>
                        <circle cx="37" cy="33" r="2.2" fill="#2C1810"/>
                        <circle cx="27.8" cy="32.2" r="0.7" fill="#FFF"/>
                        <circle cx="37.8" cy="32.2" r="0.7" fill="#FFF"/>
                        <!-- Nose -->
                        <polygon points="32,36 30,38.5 34,38.5" fill="#D4887A"/>
                        <!-- Whiskers -->
                        <line x1="15" y1="34" x2="26" y2="35.5" stroke="#A07830" stroke-width="0.5"/>
                        <line x1="14" y1="37" x2="26" y2="37" stroke="#A07830" stroke-width="0.5"/>
                        <line x1="15" y1="40" x2="26" y2="38.5" stroke="#A07830" stroke-width="0.5"/>
                        <line x1="49" y1="34" x2="38" y2="35.5" stroke="#A07830" stroke-width="0.5"/>
                        <line x1="50" y1="37" x2="38" y2="37" stroke="#A07830" stroke-width="0.5"/>
                        <line x1="49" y1="40" x2="38" y2="38.5" stroke="#A07830" stroke-width="0.5"/>
                        <!-- Mouth -->
                        <path d="M 29,40 Q 32,42 35,40" fill="none" stroke="#A07830" stroke-width="0.5"/>
                        <!-- Green pointed hat -->
                        <path d="M 22,26 L 32,6 L 42,26" fill="#5A8F4A" stroke="#447038" stroke-width="0.8"/>
                        <path d="M 21,27 Q 32,23 43,27" fill="none" stroke="#447038" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>

                <!-- Tiny mouse peeking from under the table -->
                <div class="scene-mouse">
                    <svg viewBox="0 0 32 22" width="28" height="19">
                        <ellipse cx="17" cy="15" rx="11" ry="6" fill="#A89888"/>
                        <circle cx="7" cy="13" r="5.5" fill="#B0A090"/>
                        <circle cx="5" cy="7" r="3.8" fill="#D4C0B0"/>
                        <circle cx="5" cy="7" r="2.2" fill="#E8D4C4"/>
                        <circle cx="5" cy="12" r="1.2" fill="#2C1810"/>
                        <circle cx="5.4" cy="11.6" r="0.4" fill="#FFF"/>
                        <circle cx="2" cy="14" r="1" fill="#D4887A"/>
                        <path d="M 27,14 Q 31,8 29,3" stroke="#B8A090" stroke-width="1" fill="none" stroke-linecap="round"/>
                        <line x1="2" y1="12" x2="-2" y2="11" stroke="#A89888" stroke-width="0.4"/>
                        <line x1="2" y1="14" x2="-2" y2="14.5" stroke="#A89888" stroke-width="0.4"/>
                    </svg>
                </div>
            </div>
        </div>

        <div id="feedback" class="feedback"></div>
    </div>


    <!-- ==========================================
         END SCREEN
    =========================================== -->
    <div id="end-screen" class="screen">
        <h2 class="end-title">Game Over!</h2>
        <div class="final-score-display">
            <span id="final-score">0</span> / 5
        </div>
        <p id="final-message" class="final-message"></p>
        <button id="replay-btn" class="btn">Play Again!</button>
    </div>

    <button id="mute-btn" class="mute-btn" title="Toggle music">&#x1F50A;</button>


    <script>
    /* =============================================
       SOMBRERO SHUFFLE — Game Logic
       Same game engine as v1, with SVG visuals
    ============================================= */

    // ==========================================
    // CONFIGURATION
    // ==========================================

    var LEVELS = [
        { swaps: 4,  speed: 800 },
        { swaps: 6,  speed: 600 },
        { swaps: 8,  speed: 420 },
        { swaps: 11, speed: 280 },
        { swaps: 12, speed: 240 }
    ];

    var SLOT_OFFSETS = [10, 196, 382];

    var END_MESSAGES = [
        "The meatball outsmarted you... Try again?",
        "One down! The meatball is crafty.",
        "Getting warmer! Keep your eyes peeled.",
        "Not bad! You've got some tracking skills.",
        "Almost perfect! Muy bien!",
        "PERFECT! Du \u00e4r en k\u00f6ttbullsm\u00e4stare!\n(Meatball master!)"
    ];


    // ==========================================
    // MUSIC (La Cucaracha-inspired bouncy melody)
    // ==========================================

    var MELODY = [
        { freq: 261.63, beat: 0,    dur: 0.28 },
        { freq: 261.63, beat: 0.33, dur: 0.28 },
        { freq: 261.63, beat: 0.66, dur: 0.35 },
        { freq: 349.23, beat: 1,    dur: 0.9 },
        { freq: 440.00, beat: 2,    dur: 0.9 },
        { freq: 349.23, beat: 3,    dur: 0.28 },
        { freq: 349.23, beat: 3.33, dur: 0.28 },
        { freq: 329.63, beat: 3.66, dur: 0.28 },
        { freq: 329.63, beat: 4,    dur: 0.45 },
        { freq: 293.66, beat: 4.5,  dur: 0.45 },
        { freq: 293.66, beat: 5,    dur: 0.45 },
        { freq: 261.63, beat: 5.5,  dur: 1.1 },
        { freq: 261.63, beat: 7,    dur: 0.28 },
        { freq: 293.66, beat: 7.33, dur: 0.28 },
        { freq: 329.63, beat: 7.66, dur: 0.28 }
    ];

    var BASS = [
        { freq: 130.81, beat: 0,    dur: 0.7 },
        { freq: 174.61, beat: 1,    dur: 0.7 },
        { freq: 130.81, beat: 2,    dur: 0.7 },
        { freq: 174.61, beat: 3,    dur: 0.7 },
        { freq: 146.83, beat: 4,    dur: 0.7 },
        { freq: 164.81, beat: 5,    dur: 0.7 },
        { freq: 130.81, beat: 6,    dur: 1.4 }
    ];


    // ==========================================
    // GAME STATE
    // ==========================================

    var currentLevel = 0;
    var score = 0;
    var meatballIndex = 0;
    var slotPositions = [0, 1, 2];
    var canGuess = false;

    // ==========================================
    // AUDIO STATE
    // ==========================================

    var audioCtx = null;
    var masterGain = null;
    var isMuted = false;
    var musicPlaying = false;
    var musicTimer = null;

    // ==========================================
    // DOM REFERENCES
    // ==========================================

    var titleScreen = document.getElementById('title-screen');
    var gameScreen = document.getElementById('game-screen');
    var endScreen = document.getElementById('end-screen');
    var sombreroContainer = document.getElementById('sombrero-container');
    var levelNumEl = document.getElementById('level-num');
    var scoreNumEl = document.getElementById('score-num');
    var feedbackEl = document.getElementById('feedback');
    var levelAnnounceEl = document.getElementById('level-announce');
    var finalScoreEl = document.getElementById('final-score');
    var finalMessageEl = document.getElementById('final-message');
    var muteBtnEl = document.getElementById('mute-btn');
    var sombreroElements = [];


    // ==========================================
    // HELPERS
    // ==========================================

    function sleep(ms) {
        return new Promise(function(resolve) { setTimeout(resolve, ms); });
    }

    function showScreen(name) {
        titleScreen.classList.remove('active');
        gameScreen.classList.remove('active');
        endScreen.classList.remove('active');
        if (name === 'title') titleScreen.classList.add('active');
        else if (name === 'game') gameScreen.classList.add('active');
        else if (name === 'end') endScreen.classList.add('active');
    }


    // ==========================================
    // SVG SOMBRERO GENERATION
    // Each sombrero is drawn with slightly wobbly
    // paths so they look hand-illustrated
    // ==========================================

    function generateSombreroSVG(index) {
        // Adds small random wobble to a coordinate — the hand-drawn secret sauce
        function w(base, range) {
            return (base + (Math.random() - 0.5) * range).toFixed(1);
        }

        var gradId = 'sg' + index;
        var svg = '<svg viewBox="0 0 150 88" width="148" height="86">';

        // Ground shadow
        svg += '<ellipse cx="75" cy="' + w(84,1) + '" rx="58" ry="5" fill="rgba(0,0,0,0.08)"/>';

        // Brim — wobbly organic ellipse
        svg += '<path d="M ' + w(7,3) + ',74';
        svg += ' Q ' + w(38,3) + ',' + w(65,2) + ' 75,' + w(64,1);
        svg += ' Q ' + w(112,3) + ',' + w(65,2) + ' ' + w(143,3) + ',74';
        svg += ' Q ' + w(128,3) + ',' + w(89,2) + ' 75,' + w(89,1);
        svg += ' Q ' + w(22,3) + ',' + w(89,2) + ' ' + w(7,3) + ',74 Z"';
        svg += ' fill="url(#' + gradId + ')" stroke="#7A3025" stroke-width="1.3" stroke-linejoin="round"/>';

        // Crown — tall rounded shape with organic wobble
        svg += '<path d="M ' + w(44,2) + ',71';
        svg += ' C ' + w(43,2) + ',53 ' + w(41,2) + ',28 ' + w(49,2) + ',' + w(16,2);
        svg += ' C ' + w(56,2) + ',' + w(7,2) + ' ' + w(66,2) + ',' + w(4,1) + ' 75,' + w(3,1);
        svg += ' C ' + w(84,2) + ',' + w(4,1) + ' ' + w(94,2) + ',' + w(7,2) + ' ' + w(101,2) + ',' + w(16,2);
        svg += ' C ' + w(109,2) + ',28 ' + w(107,2) + ',53 ' + w(106,2) + ',71"';
        svg += ' fill="url(#' + gradId + ')" stroke="#7A3025" stroke-width="1.3" stroke-linejoin="round"/>';

        // Gold band
        svg += '<rect x="44" y="61" width="62" height="10" rx="2" fill="url(#band-grad)" stroke="#B8892A" stroke-width="0.7"/>';

        // Zigzag decoration on the band
        var zigzag = 'M 46,66';
        for (var z = 0; z < 14; z++) {
            zigzag += ' L ' + (50 + z * 4) + ',' + (z % 2 === 0 ? '62' : '70');
        }
        svg += '<path d="' + zigzag + '" fill="none" stroke="rgba(160,120,30,0.3)" stroke-width="0.7"/>';

        // Brim front edge — gives depth
        svg += '<path d="M ' + w(10,2) + ',74 Q 75,' + w(87,2) + ' ' + w(140,2) + ',74" fill="none" stroke="#6A2520" stroke-width="0.8" opacity="0.4"/>';

        // Crown highlight — the "light catching the surface" effect
        svg += '<path d="M ' + w(54,2) + ',' + w(20,2) + ' Q ' + w(66,3) + ',' + w(8,2) + ' ' + w(82,3) + ',' + w(13,2) + '"';
        svg += ' fill="none" stroke="rgba(255,220,180,0.18)" stroke-width="4" stroke-linecap="round"/>';

        svg += '</svg>';
        return svg;
    }


    // ==========================================
    // SOMBRERO CREATION
    // ==========================================

    function createSombreros() {
        sombreroContainer.innerHTML = '';
        sombreroElements = [];

        for (var i = 0; i < 3; i++) {
            var wrapper = document.createElement('div');
            wrapper.className = 'sombrero-wrapper';
            wrapper.style.left = SLOT_OFFSETS[i] + 'px';

            // The hat gets an SVG sombrero, the meatball stays as CSS art
            wrapper.innerHTML =
                '<div class="sombrero-hat">' +
                    generateSombreroSVG(i) +
                '</div>' +
                '<div class="meatball-area">' +
                    '<div class="meatball">' +
                        '<div class="flag-stick"></div>' +
                        '<div class="swedish-flag">' +
                            '<div class="flag-cross-h"></div>' +
                            '<div class="flag-cross-v"></div>' +
                        '</div>' +
                    '</div>' +
                '</div>';

            (function(index) {
                wrapper.addEventListener('click', function() { handleGuess(index); });
            })(i);

            sombreroContainer.appendChild(wrapper);
            sombreroElements.push(wrapper);
        }
    }


    // ==========================================
    // POSITION & ANIMATION HELPERS
    // ==========================================

    function updatePositions(speed) {
        for (var i = 0; i < sombreroElements.length; i++) {
            var el = sombreroElements[i];
            el.style.transition = speed > 0 ? 'left ' + speed + 'ms ease-in-out' : 'none';
            el.style.left = SLOT_OFFSETS[slotPositions[i]] + 'px';
        }
    }

    function liftSombrero(index) {
        sombreroElements[index].querySelector('.sombrero-hat').classList.add('lifted');
    }

    function lowerSombrero(index) {
        sombreroElements[index].querySelector('.sombrero-hat').classList.remove('lifted');
    }

    function lowerAllSombreros() {
        for (var i = 0; i < sombreroElements.length; i++) lowerSombrero(i);
    }

    function showMeatball(index) {
        sombreroElements[index].querySelector('.meatball-area').classList.add('visible');
    }

    function hideAllMeatballs() {
        for (var i = 0; i < sombreroElements.length; i++) {
            sombreroElements[i].querySelector('.meatball-area').classList.remove('visible');
        }
    }


    // ==========================================
    // SWAP LOGIC
    // ==========================================

    function generateSwaps(count) {
        var startSlot = slotPositions[meatballIndex];
        var swaps, testSlots, lastA, lastB;

        do {
            swaps = [];
            testSlots = [slotPositions[0], slotPositions[1], slotPositions[2]];
            lastA = -1;
            lastB = -1;

            for (var i = 0; i < count; i++) {
                var a, b;
                do {
                    a = Math.floor(Math.random() * 3);
                    do { b = Math.floor(Math.random() * 3); } while (b === a);
                    if (a > b) { var temp = a; a = b; b = temp; }
                } while (a === lastA && b === lastB);

                swaps.push([a, b]);
                lastA = a;
                lastB = b;

                var t = testSlots[a];
                testSlots[a] = testSlots[b];
                testSlots[b] = t;
            }
        } while (testSlots[meatballIndex] === startSlot);

        return swaps;
    }

    async function performSwap(a, b, speed) {
        var tempSlot = slotPositions[a];
        slotPositions[a] = slotPositions[b];
        slotPositions[b] = tempSlot;

        sombreroElements[a].style.zIndex = '10';
        sombreroElements[b].style.zIndex = '5';

        updatePositions(speed);
        await sleep(speed);

        sombreroElements[a].style.zIndex = '';
        sombreroElements[b].style.zIndex = '';
    }


    // ==========================================
    // GAME FLOW
    // ==========================================

    async function startGame() {
        score = 0;
        currentLevel = 0;
        createSombreros();
        showScreen('game');
        updateScoreDisplay();
        initAudio();
        startMusic();
        await sleep(400);
        await nextLevel();
    }

    async function nextLevel() {
        currentLevel++;
        if (currentLevel > 5) { endGame(); return; }

        levelNumEl.textContent = currentLevel;
        updateScoreDisplay();
        await announceLevel(currentLevel);

        slotPositions = [0, 1, 2];
        updatePositions(0);
        sombreroContainer.offsetHeight;
        await sleep(200);

        meatballIndex = Math.floor(Math.random() * 3);

        showMeatball(meatballIndex);
        await sleep(100);
        liftSombrero(meatballIndex);
        await sleep(1800);

        lowerSombrero(meatballIndex);
        await sleep(500);
        hideAllMeatballs();
        await sleep(400);

        var level = LEVELS[currentLevel - 1];
        var swaps = generateSwaps(level.swaps);

        for (var i = 0; i < swaps.length; i++) {
            await performSwap(swaps[i][0], swaps[i][1], level.speed);
            await sleep(Math.max(50, Math.floor(level.speed * 0.15)));
        }

        await sleep(250);

        canGuess = true;
        for (var j = 0; j < sombreroElements.length; j++) {
            sombreroElements[j].classList.add('clickable');
        }
        showFeedback('Pick a sombrero!', 'prompt');
    }

    async function handleGuess(clickedIndex) {
        if (!canGuess) return;
        canGuess = false;

        for (var i = 0; i < sombreroElements.length; i++) {
            sombreroElements[i].classList.remove('clickable');
        }

        liftSombrero(clickedIndex);

        var correct = (clickedIndex === meatballIndex);

        if (correct) {
            showMeatball(clickedIndex);
            score++;
            playCorrectSound();
            showFeedback('Correct!', 'correct');
        } else {
            playWrongSound();
            showFeedback('Nope!', 'wrong');
            await sleep(700);
            liftSombrero(meatballIndex);
            showMeatball(meatballIndex);
        }

        updateScoreDisplay();
        await sleep(2200);

        hideFeedback();
        lowerAllSombreros();
        await sleep(450);
        hideAllMeatballs();
        await sleep(350);

        await nextLevel();
    }

    function endGame() {
        stopMusic();
        showScreen('end');
        finalScoreEl.textContent = score;
        finalMessageEl.textContent = END_MESSAGES[score];

        if (score === 5) {
            finalMessageEl.style.fontSize = '1.4rem';
            finalMessageEl.style.color = '#B8463A';
        } else {
            finalMessageEl.style.fontSize = '1.2rem';
            finalMessageEl.style.color = '#5D4037';
        }
    }


    // ==========================================
    // UI HELPERS
    // ==========================================

    function updateScoreDisplay() { scoreNumEl.textContent = score; }

    function showFeedback(text, type) {
        feedbackEl.textContent = text;
        feedbackEl.className = 'feedback visible ' + (type || '');
    }

    function hideFeedback() { feedbackEl.classList.remove('visible'); }

    async function announceLevel(level) {
        levelAnnounceEl.textContent = 'Level ' + level;
        levelAnnounceEl.classList.add('visible');
        await sleep(1200);
        levelAnnounceEl.classList.remove('visible');
        await sleep(400);
    }


    // ==========================================
    // AUDIO SYSTEM
    // ==========================================

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = isMuted ? 0 : 0.7;
        masterGain.connect(audioCtx.destination);
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playNote(freq, startTime, duration, volume, wave) {
        if (!audioCtx) return;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = wave || 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(volume || 0.06, startTime + 0.012);
        gain.gain.setValueAtTime((volume || 0.06) * 0.7, startTime + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + Math.max(duration, 0.1));
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.05);
    }

    function startMusic() {
        musicPlaying = true;
        scheduleMelodyLoop();
    }

    function stopMusic() {
        musicPlaying = false;
        if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
    }

    function scheduleMelodyLoop() {
        if (!musicPlaying || !audioCtx) return;
        var now = audioCtx.currentTime + 0.08;
        var bpm = 138 + (currentLevel - 1) * 6;
        var beatLength = 60 / bpm;

        for (var i = 0; i < MELODY.length; i++) {
            var n = MELODY[i];
            playNote(n.freq, now + n.beat * beatLength, n.dur * beatLength, 0.05, 'triangle');
        }
        for (var j = 0; j < BASS.length; j++) {
            var b = BASS[j];
            playNote(b.freq, now + b.beat * beatLength, b.dur * beatLength, 0.035, 'sine');
        }

        var loopDurationMs = 8 * beatLength * 1000;
        musicTimer = setTimeout(scheduleMelodyLoop, loopDurationMs);
    }

    function playCorrectSound() {
        if (!audioCtx) return;
        var now = audioCtx.currentTime;
        playNote(523.25, now, 0.15, 0.12, 'triangle');
        playNote(659.25, now + 0.12, 0.15, 0.12, 'triangle');
        playNote(783.99, now + 0.24, 0.35, 0.12, 'triangle');
    }

    function playWrongSound() {
        if (!audioCtx) return;
        var now = audioCtx.currentTime;
        playNote(293.66, now, 0.35, 0.10, 'sine');
        playNote(233.08, now + 0.25, 0.55, 0.10, 'sine');
    }

    function toggleMute() {
        isMuted = !isMuted;
        if (masterGain) {
            masterGain.gain.linearRampToValueAtTime(isMuted ? 0 : 0.7, audioCtx.currentTime + 0.1);
        }
        muteBtnEl.textContent = isMuted ? '\u{1F507}' : '\u{1F50A}';
    }


    // ==========================================
    // EVENT LISTENERS
    // ==========================================

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('replay-btn').addEventListener('click', startGame);
    muteBtnEl.addEventListener('click', toggleMute);

    </script>
