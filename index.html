<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axel Lönnroth</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafafa;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 3rem;
    }

    .games {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a.card {
      display: block;
      text-decoration: none;
      color: #333;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 32px 36px;
      width: 220px;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    a.card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .card-emoji {
      font-size: 2.4rem;
      margin-bottom: 12px;
    }

    .card-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .card-desc {
      color: #888;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Axel Lönnroth</h1>
    <p class="subtitle">Games & experiments</p>
    <div class="games">
      <a class="card" href="/sombrero/">
        <div class="card-emoji">🎩</div>
        <div class="card-title">Sombrero Shuffle</div>
        <div class="card-desc">Find the ball under the hat</div>
      </a>
      <a class="card" href="/enchilada/">
        <div class="card-emoji">🫔</div>
        <div class="card-title">Enchilada Piano</div>
        <div class="card-desc">Play piano with enchiladas</div>
      </a>
      <a class="card" href="/the-deck/">
        <div class="card-emoji">🎴</div>
        <div class="card-title">The Deck</div>
        <div class="card-desc">Questions for two</div>
      </a>
      <a class="card" href="/sabbatical/">
        <div class="card-emoji">🗺️</div>
        <div class="card-title">Sabbatical Map</div>
        <div class="card-desc">A solo route through Southeast Asia</div>
      </a>
    </div>
  </div>
</body>
</html>
