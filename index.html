<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enchilada Piano</title>

  <!-- Press Start 2P: a chunky pixel font from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ===== SCANLINE OVERLAY — gives that retro CRT monitor look ===== */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.08) 0px,
        rgba(0, 0, 0, 0.08) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 1000;
    }

    /* ===== TITLE ===== */
    h1 {
      color: #e94560;
      font-size: 2rem;
      text-shadow:
        3px 3px 0 #0f3460,
        -1px -1px 0 #533483;
      margin-bottom: 0.5rem;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #8b8ba7;
      font-size: 0.55rem;
      margin-bottom: 2.5rem;
      letter-spacing: 1px;
    }

    /* ===== STAGE — the container that shakes ===== */
    .stage {
      display: flex;
      gap: 18px;
      align-items: flex-end;
      padding: 30px 20px;
      position: relative;
    }

    .stage.shake {
      animation: screenShake 0.3s ease-out;
    }

    @keyframes screenShake {
      0%  { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-4px, 2px) rotate(-1deg); }
      40% { transform: translate(3px, -3px) rotate(1deg); }
      60% { transform: translate(-2px, 1px) rotate(-0.5deg); }
      80% { transform: translate(2px, -1px) rotate(0.5deg); }
      100%{ transform: translate(0, 0) rotate(0deg); }
    }

    /* ===== ENCHILADA WRAPPER ===== */
    .enchilada-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .enchilada-wrapper:hover {
      transform: scale(1.05);
    }

    .enchilada-wrapper:active {
      transform: scale(0.95);
    }

    /* ===== THE ENCHILADA — pixel art drawn with CSS ===== */
    .enchilada {
      width: 90px;
      height: 50px;
      position: relative;
      image-rendering: pixelated;
      /* Disable smoothing to keep things chunky */
      -ms-interpolation-mode: nearest-neighbor;
    }

    /* Tortilla body — the main wrap */
    .tortilla {
      width: 90px;
      height: 40px;
      background: #d4a056;
      border-radius: 8px 8px 20px 20px;
      position: absolute;
      bottom: 0;
      /* Pixel-style border */
      box-shadow:
        inset 0 -4px 0 #b8863c,
        inset 0 4px 0 #e8be78,
        0 2px 0 #2a1a0a;
      overflow: hidden;
    }

    /* Filling visible at the top — the good stuff inside */
    .filling {
      position: absolute;
      top: 0;
      left: 8px;
      right: 8px;
      height: 14px;
      background: #6b4226;
      border-radius: 4px 4px 0 0;
      box-shadow:
        inset 0 2px 0 #8b5e3c,
        inset 0 -2px 0 #4a2e18;
    }

    /* Sauce drizzle on top — each enchilada gets a unique sauce color */
    .sauce {
      position: absolute;
      top: -6px;
      left: 12px;
      right: 12px;
      height: 12px;
      border-radius: 6px;
      box-shadow:
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        inset 0 2px 0 rgba(255, 255, 255, 0.15);
    }

    /* Sauce drip details */
    .sauce::before,
    .sauce::after {
      content: '';
      position: absolute;
      bottom: -6px;
      width: 6px;
      height: 8px;
      background: inherit;
      border-radius: 0 0 3px 3px;
    }
    .sauce::before { left: 10px; }
    .sauce::after { right: 14px; height: 6px; }

    /* Pixel highlights on the tortilla — gives it that 8-bit texture */
    .tortilla::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 6px;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      box-shadow:
        8px 0 0 rgba(255, 255, 255, 0.15),
        16px 4px 0 rgba(255, 255, 255, 0.1),
        40px -2px 0 rgba(255, 255, 255, 0.15),
        56px 2px 0 rgba(255, 255, 255, 0.1);
    }

    /* ===== SAUCE COLORS — one per enchilada, rainbow style ===== */
    .enchilada-wrapper[data-note="C"] .sauce { background: #e94560; } /* Red */
    .enchilada-wrapper[data-note="D"] .sauce { background: #e88c30; } /* Orange */
    .enchilada-wrapper[data-note="E"] .sauce { background: #e8d530; } /* Yellow */
    .enchilada-wrapper[data-note="F"] .sauce { background: #53d769; } /* Green */
    .enchilada-wrapper[data-note="G"] .sauce { background: #30c5e8; } /* Cyan */
    .enchilada-wrapper[data-note="A"] .sauce { background: #5b6ee1; } /* Blue */
    .enchilada-wrapper[data-note="B"] .sauce { background: #9b59b6; } /* Purple */

    /* ===== GLOW when active — matches sauce color ===== */
    .enchilada-wrapper[data-note="C"].active .enchilada { filter: drop-shadow(0 0 12px #e94560) drop-shadow(0 0 24px #e94560); }
    .enchilada-wrapper[data-note="D"].active .enchilada { filter: drop-shadow(0 0 12px #e88c30) drop-shadow(0 0 24px #e88c30); }
    .enchilada-wrapper[data-note="E"].active .enchilada { filter: drop-shadow(0 0 12px #e8d530) drop-shadow(0 0 24px #e8d530); }
    .enchilada-wrapper[data-note="F"].active .enchilada { filter: drop-shadow(0 0 12px #53d769) drop-shadow(0 0 24px #53d769); }
    .enchilada-wrapper[data-note="G"].active .enchilada { filter: drop-shadow(0 0 12px #30c5e8) drop-shadow(0 0 24px #30c5e8); }
    .enchilada-wrapper[data-note="A"].active .enchilada { filter: drop-shadow(0 0 12px #5b6ee1) drop-shadow(0 0 24px #5b6ee1); }
    .enchilada-wrapper[data-note="B"].active .enchilada { filter: drop-shadow(0 0 12px #9b59b6) drop-shadow(0 0 24px #9b59b6); }

    /* ===== NOTE LABEL below each enchilada ===== */
    .note-label {
      color: #8b8ba7;
      font-size: 0.6rem;
      margin-top: 10px;
      transition: color 0.2s;
    }

    .key-hint {
      color: #4a4a6a;
      font-size: 0.45rem;
      margin-top: 4px;
    }

    .enchilada-wrapper.active .note-label {
      color: #fff;
    }

    /* ===== BOUNCE + SPIN animation ===== */
    .enchilada-wrapper.active .enchilada {
      animation: bounceAndSpin 0.4s ease-out;
    }

    @keyframes bounceAndSpin {
      0%   { transform: translateY(0) rotate(0deg) scale(1); }
      15%  { transform: translateY(-30px) rotate(-15deg) scale(1.15); }
      30%  { transform: translateY(-45px) rotate(180deg) scale(1.1); }
      50%  { transform: translateY(-20px) rotate(360deg) scale(1.05); }
      70%  { transform: translateY(5px) rotate(370deg) scale(0.95); }
      85%  { transform: translateY(-3px) rotate(365deg) scale(1.02); }
      100% { transform: translateY(0) rotate(360deg) scale(1); }
    }

    /* ===== SAUCE SPLAT PARTICLES ===== */
    .sauce-particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 100;
    }

    .sauce-particle.animate {
      animation: splatFly 0.5s ease-out forwards;
    }

    @keyframes splatFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--splat-x), var(--splat-y)) scale(0.3);
      }
    }

    /* ===== FOOTER ===== */
    .footer {
      margin-top: 2.5rem;
      color: #4a4a6a;
      font-size: 0.4rem;
      text-align: center;
      line-height: 2;
    }

    /* ===== RESPONSIVE — stack enchiladas tighter on small screens ===== */
    @media (max-width: 768px) {
      h1 { font-size: 1.2rem; }
      .stage { gap: 8px; padding: 20px 10px; }
      .enchilada { width: 65px; height: 38px; }
      .tortilla { width: 65px; height: 30px; }
      .filling { left: 5px; right: 5px; height: 10px; }
      .sauce { left: 8px; right: 8px; top: -4px; height: 10px; }
      .note-label { font-size: 0.45rem; }
      .key-hint { font-size: 0.35rem; }
    }

    @media (max-width: 480px) {
      .stage { gap: 4px; flex-wrap: wrap; justify-content: center; }
      .enchilada { width: 55px; height: 32px; }
      .tortilla { width: 55px; height: 26px; }
    }
  </style>
</head>
<body>

  <h1>ENCHILADA PIANO</h1>
  <p class="subtitle">CLICK OR PRESS A-S-D-F-G-H-J TO PLAY</p>

  <div class="stage" id="stage">
    <!-- 7 enchiladas, one per note. Each has a tortilla body, filling, and sauce drizzle. -->
    <div class="enchilada-wrapper" data-note="C" data-key="a">
      <div class="enchilada">
        <div class="filling"></div>
        <div class="tortilla"></div>
        <div class="sauce"></div>
      </div>
      <span class="note-label">C</span>
      <span class="key-hint">A</span>
    </div>

    <div class="enchilada-wrapper" data-note="D" data-key="s">
      <div class="enchilada">
        <div class="filling"></div>
        <div class="tortilla"></div>
        <div class="sauce"></div>
      </div>
      <span class="note-label">D</span>
      <span class="key-hint">S</span>
    </div>

    <div class="enchilada-wrapper" data-note="E" data-key="d">
      <div class="enchilada">
        <div class="filling"></div>
        <div class="tortilla"></div>
        <div class="sauce"></div>
      </div>
      <span class="note-label">E</span>
      <span class="key-hint">D</span>
    </div>

    <div class="enchilada-wrapper" data-note="F" data-key="f">
      <div class="enchilada">
        <div class="filling"></div>
        <div class="tortilla"></div>
        <div class="sauce"></div>
      </div>
      <span class="note-label">F</span>
      <span class="key-hint">F</span>
    </div>

    <div class="enchilada-wrapper" data-note="G" data-key="g">
      <div class="enchilada">
        <div class="filling"></div>
        <div class="tortilla"></div>
        <div class="sauce"></div>
      </div>
      <span class="note-label">G</span>
      <span class="key-hint">G</span>
    </div>

    <div class="enchilada-wrapper" data-note="A" data-key="h">
      <div class="enchilada">
        <div class="filling"></div>
        <div class="tortilla"></div>
        <div class="sauce"></div>
      </div>
      <span class="note-label">A</span>
      <span class="key-hint">H</span>
    </div>

    <div class="enchilada-wrapper" data-note="B" data-key="j">
      <div class="enchilada">
        <div class="filling"></div>
        <div class="tortilla"></div>
        <div class="sauce"></div>
      </div>
      <span class="note-label">B</span>
      <span class="key-hint">J</span>
    </div>
  </div>

  <div class="footer">
    MADE WITH SALSA & JAVASCRIPT
  </div>

  <script>
    // ==========================================================
    // ENCHILADA PIANO — all the game logic lives here
    // ==========================================================

    // --- Piano note frequencies (Hz) for one octave starting at middle C ---
    // These are the exact frequencies that make each note sound right
    const NOTE_FREQUENCIES = {
      C: 261.63,
      D: 293.66,
      E: 329.63,
      F: 349.23,
      G: 392.00,
      A: 440.00,
      B: 493.88
    };

    // --- Sauce colors matching the CSS, used for splat particles ---
    const SAUCE_COLORS = {
      C: '#e94560',
      D: '#e88c30',
      E: '#e8d530',
      F: '#53d769',
      G: '#30c5e8',
      A: '#5b6ee1',
      B: '#9b59b6'
    };

    // --- Set up the Web Audio API ---
    // Think of AudioContext as a tiny recording studio inside the browser.
    // We create sounds by generating waveforms (oscillators) and shaping
    // their volume over time (gain envelopes).
    let audioContext = null;

    function getAudioContext() {
      // Browsers require a user gesture before playing audio,
      // so we create the context on first interaction
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioContext;
    }

    // --- Play a piano-like sound for a given note ---
    function playNote(noteName) {
      const ctx = getAudioContext();
      const frequency = NOTE_FREQUENCIES[noteName];
      const now = ctx.currentTime;

      // CREATE THE SOUND SOURCE
      // An oscillator generates a continuous tone at a specific frequency.
      // We use a "triangle" wave — it's softer than a square wave and
      // sounds more piano-like than a plain sine wave.
      const oscillator = ctx.createOscillator();
      oscillator.type = 'triangle';
      oscillator.frequency.setValueAtTime(frequency, now);

      // Add a second oscillator slightly detuned for richness
      // (like how a real piano has multiple strings per note)
      const oscillator2 = ctx.createOscillator();
      oscillator2.type = 'sine';
      oscillator2.frequency.setValueAtTime(frequency * 2, now); // One octave up (harmonic)

      // SHAPE THE VOLUME (ADSR envelope)
      // This makes it sound like a key strike instead of a flat beep:
      //   Attack:  volume rises quickly (the hammer hitting the string)
      //   Decay:   volume drops to a sustain level
      //   Sustain: holds at a medium level
      //   Release: fades out to silence
      const gainNode = ctx.createGain();
      gainNode.gain.setValueAtTime(0, now);
      gainNode.gain.linearRampToValueAtTime(0.5, now + 0.01);  // Attack: quick rise
      gainNode.gain.exponentialRampToValueAtTime(0.2, now + 0.1);  // Decay
      gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.2); // Release: fade out

      // Second oscillator is quieter (it's just adding color)
      const gainNode2 = ctx.createGain();
      gainNode2.gain.setValueAtTime(0, now);
      gainNode2.gain.linearRampToValueAtTime(0.12, now + 0.01);
      gainNode2.gain.exponentialRampToValueAtTime(0.01, now + 0.8);

      // CONNECT everything to the speakers
      oscillator.connect(gainNode);
      gainNode.connect(ctx.destination);

      oscillator2.connect(gainNode2);
      gainNode2.connect(ctx.destination);

      // START and auto-stop
      oscillator.start(now);
      oscillator.stop(now + 1.5);

      oscillator2.start(now);
      oscillator2.stop(now + 1.0);
    }

    // --- Create sauce splat particles ---
    // Spawns little colored dots that fly out in random directions
    function createSauceSplats(wrapper, noteName) {
      const rect = wrapper.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const color = SAUCE_COLORS[noteName];

      // Spawn 8 particles in random directions
      for (let i = 0; i < 8; i++) {
        const particle = document.createElement('div');
        particle.className = 'sauce-particle';
        particle.style.background = color;
        particle.style.left = centerX + 'px';
        particle.style.top = centerY + 'px';
        particle.style.position = 'fixed';

        // Random direction and distance for each splat
        const angle = (Math.PI * 2 / 8) * i + (Math.random() * 0.5 - 0.25);
        const distance = 40 + Math.random() * 60;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance - 20; // bias upward

        // Set CSS custom properties for the animation endpoint
        particle.style.setProperty('--splat-x', dx + 'px');
        particle.style.setProperty('--splat-y', dy + 'px');

        // Random sizes for variety
        const size = 4 + Math.random() * 8;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';

        document.body.appendChild(particle);

        // Trigger animation on next frame (so the browser registers the element first)
        requestAnimationFrame(() => {
          particle.classList.add('animate');
        });

        // Clean up after animation finishes
        setTimeout(() => {
          particle.remove();
        }, 600);
      }
    }

    // --- Trigger screen shake ---
    function shakeScreen() {
      const stage = document.getElementById('stage');
      stage.classList.remove('shake');
      // Force browser to acknowledge the removal before re-adding
      void stage.offsetWidth;
      stage.classList.add('shake');
    }

    // --- Main function: play an enchilada! ---
    function playEnchilada(noteName) {
      const wrapper = document.querySelector(`.enchilada-wrapper[data-note="${noteName}"]`);
      if (!wrapper) return;

      // 1. Play the piano sound
      playNote(noteName);

      // 2. Trigger bounce + spin animation
      wrapper.classList.remove('active');
      void wrapper.offsetWidth; // Reset animation if already playing
      wrapper.classList.add('active');

      // 3. Sauce splat particles
      createSauceSplats(wrapper, noteName);

      // 4. Screen shake
      shakeScreen();

      // Remove active class after animation completes
      setTimeout(() => {
        wrapper.classList.remove('active');
      }, 450);
    }

    // --- CLICK / TAP support ---
    document.querySelectorAll('.enchilada-wrapper').forEach(wrapper => {
      // Use pointerdown for instant response (no 300ms delay on mobile)
      wrapper.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        const note = wrapper.getAttribute('data-note');
        playEnchilada(note);
      });
    });

    // --- KEYBOARD support (A, S, D, F, G, H, J) ---
    const KEY_TO_NOTE = {
      a: 'C',
      s: 'D',
      d: 'E',
      f: 'F',
      g: 'G',
      h: 'A',
      j: 'B'
    };

    // Track which keys are currently held down to prevent repeats
    const keysDown = new Set();

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      // Ignore if key is already held down (prevents machine-gun repeats)
      if (keysDown.has(key)) return;

      const note = KEY_TO_NOTE[key];
      if (note) {
        keysDown.add(key);
        playEnchilada(note);
      }
    });

    document.addEventListener('keyup', (event) => {
      keysDown.delete(event.key.toLowerCase());
    });
  </script>

</body>
</html>
