<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>The Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Paper grain overlay -->
  <div class="grain" aria-hidden="true"></div>

  <!-- ── LANDING SCREEN ── -->
  <div id="screen-landing" class="screen active">
    <header class="landing-header">
      <h1 class="app-title">The Deck</h1>
      <p class="app-subtitle">Pick a theme to begin.</p>
    </header>
    <div id="category-grid" class="category-grid">
      <!-- cards injected by app.js -->
    </div>
  </div>

  <!-- ── QUESTION SCREEN ── -->
  <div id="screen-questions" class="screen">
    <div class="question-header">
      <button id="back-btn" class="back-btn" aria-label="Back to themes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M5 12l7-7M5 12l7 7"/>
        </svg>
      </button>
      <div id="category-pill" class="category-pill">
        <span id="pill-icon" class="pill-icon"></span>
        <span id="pill-name" class="pill-name"></span>
      </div>
      <div class="header-spacer"></div>
    </div>

    <div class="progress-bar-track" aria-hidden="true">
      <div id="progress-bar" class="progress-bar-fill"></div>
    </div>

    <div class="question-stage">
      <div id="question-card" class="question-card">
        <p id="question-text" class="question-text"></p>
      </div>
      <!-- Swipe direction hints (visible briefly on drag) -->
      <div id="hint-skip" class="swipe-hint-label skip-hint">Skip</div>
      <div id="hint-answer" class="swipe-hint-label answer-hint">Answer</div>
    </div>

    <div class="action-row">
      <button id="skip-btn" class="action-btn btn-skip" aria-label="Skip this question">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
      <p class="swipe-instruction">swipe or tap</p>
      <button id="answer-btn" class="action-btn btn-answer" aria-label="We're answering this">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ── DONE SCREEN ── -->
  <div id="screen-done" class="screen">
    <div class="done-content">
      <div id="done-icon" class="done-icon"></div>
      <p class="done-title">All done.</p>
      <p class="done-sub">You've been through every question in this theme.</p>
      <button id="done-back-btn" class="pill-btn">Back to themes</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
